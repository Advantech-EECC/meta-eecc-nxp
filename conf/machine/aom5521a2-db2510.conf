#@TYPE: Machine
#@NAME: Advantech i.MX 95 AOM-5521 Board
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Advantech i.MX 95 AOM-5521 Board
#@MAINTAINER: Advantech RISC SW Team

MACHINEOVERRIDES =. "aom5521:mx95"

require conf/machine/include/imx95-evk.inc

MACHINE_FEATURES:append:use-nxp-bsp = " nxp9098-pcie"

KERNEL_DEVICETREE_BASENAME = "${MACHINE}"

UBOOT_CONFIG_BASENAME = "imx95_aom5521a2"
IMX_SOC_REV:${MACHINE} = "B0"

IMXBOOT_TARGETS_BASENAME = "flash"
OEI_BOARD  = "${@bb.utils.contains('UBOOT_CONFIG', '8G', 'mx95lp5_aom5521a2_8G', \
							  'mx95lp5', d)}"
DDR_TYPE   = "lpddr5"
OEI_CONFIGS = "ddr tcm"
OEI_DDR_CONFIG     = "lpddr5_timing"
OEI_DDR_CONFIG_ECC = ""

DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"

# Include device trees
KERNEL_DEVICETREE += " \
    freescale/${KERNEL_DEVICETREE_BASENAME}-m2-sdio.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-lvds0-auo.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-lvds1-auo.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-lvds-dual.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-auog101uan02.dtb \
"

# imx-boot (flash.bin) targets based on UBOOT_CONFIG and IMXBOOT_VARIANT
IMXBOOT_TARGETS_SD = " \
    ${@bb.utils.contains('IMXBOOT_VARIANT', 'alt',       '${IMXBOOT_TARGETS_BASENAME}_alt', \
       bb.utils.contains('IMXBOOT_VARIANT', 'jailhouse', '${IMXBOOT_TARGETS_BASENAME}_jailhouse', \
       bb.utils.contains('IMXBOOT_VARIANT', 'netc',      '${IMXBOOT_TARGETS_BASENAME}_netc', \
       bb.utils.contains('IMXBOOT_VARIANT', 'rpmsg',     '${IMXBOOT_TARGETS_BASENAME}_lpboot_sm_a55', \
       bb.utils.contains('IMXBOOT_VARIANT', 'sof',       '${IMXBOOT_TARGETS_BASENAME}_a55', \
                                                         '${IMXBOOT_TARGETS_BASENAME}_all', d), d), d), d), d)} \
"

IMXBOOT_TARGETS = " \
    ${@bb.utils.contains('UBOOT_CONFIG', 'fspi', '${IMXBOOT_TARGETS_BASENAME}_a55_flexspi', '${IMXBOOT_TARGETS_SD}', d)} \
"

UBOOT_CONFIG = "8G"
UBOOT_CONFIG[8G] = "${UBOOT_CONFIG_BASENAME}_8G_defconfig,sdcard"
UBOOT_CONFIG[fspi] = "${UBOOT_CONFIG_BASENAME}_evk_fspi_defconfig"

