MACHINEOVERRIDES =. "mx95:"

require conf/machine/imx95-19x19-lpddr5-evk.conf

MACHINE_FEATURES += "pci wifi bluetooth optee"
MACHINE_FEATURES:append:use-nxp-bsp = " nxpwifi-all-pcie nxpwifi-all-sdio jailhouse dpdk xen"

KERNEL_DEVICETREE_BASENAME = "imx95-aom5521-a1"

IMX_SOC_REV:aom5521a1-db2510 = "A0"

EVK_KERNEL_DEVICETREES := "${KERNEL_DEVICETREE}"
KERNEL_DEVICETREE:remove = "${EVK_KERNEL_DEVICETREES}"
KERNEL_DEVICETREE:append = " \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-auog101uan02.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-lvds0-auo.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-lvds0-auog070vw01-v1.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-lvds1-auo.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-lvds1-auog070vw01-v1.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-lvds-dual.dtb \
    ./freescale/${KERNEL_DEVICETREE_BASENAME}-m2-sdio.dtb \
"

MACHINE_FEATURES:append:use-nxp-bsp = " nxp9098-pcie"

IMXBOOT_TARGETS_BASENAME = "flash"


DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"

OEI_CONFIGS = "ddr tcm"
OEI_CORE   = "m33"
OEI_SOC    = "mx95"
DDR_TYPE   = "lpddr5"
OEI_BOARD  = "mx95lp5_aom5521a1_8G"

IMXBOOT_VARIANTS = "alt jailhouse netc rpmsg sof"

OEI_DDR_CONFIG     = "lpddr5_timing"
OEI_DDR_CONFIG_ECC = ""

IMXBOOT_TARGETS = " \
    ${@bb.utils.contains('UBOOT_CONFIG', 'fspi', '${IMXBOOT_TARGETS_BASENAME}_a55_flexspi', '${IMXBOOT_TARGETS_SD}', d)} \
"

UBOOT_CONFIG_BASENAME = "imx95_19x19"
