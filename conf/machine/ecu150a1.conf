MACHINEOVERRIDES =. "ecu150a1:"
require conf/machine/imx8mqevk.conf

KERNEL_DEVICETREE_BASENAME = "ecu150a1"

KERNEL_DEVICETREE:ecu150a1 = "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"

SERIAL_CONSOLES = "115200;ttymxc0"

# Set DDR FIRMWARE
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
"

UBOOT_DTB_NAME = "ecu150a1.dtb"

DISTRO_FEATURES:remove = "wayland x11"
IMAGE_FEATURES:remove = "splash"
